[build-system]
requires = ["setuptools >= 40.6.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lcai"
version = "2.0.0"
description = "Arches implementation for the Lincoln County Archaeological Initiative"
readme = "README.md"
license = {text = "GNU AGPL3"}
requires-python = ">=3.10,<3.13"

dependencies = [
    "arches>=7,<8",
    "setuptools<=80.9.0",
    "uwsgi~=2.0",
]

[tool.setuptools]
packages = [
    "lcai"
]

[tool.uv.sources]
arches = { path = "../arches", editable = true }
